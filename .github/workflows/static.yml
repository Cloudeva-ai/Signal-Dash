name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check game
        run: |
          node qa/world-check.cjs
          node qa/motion-check.cjs
          node qa/touch-check.cjs
          node qa/viewport-check.cjs
          node qa/render-check.cjs
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest .nojekyll CNAME _site/
          cp -R src assets mascot _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
