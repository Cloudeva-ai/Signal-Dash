# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4 targets Node 20, which the runners now force onto Node 24 and warn
        # about. No inputs are passed here, so the bump carries no risk.
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Asks the action to create the Pages site if it is missing.
          #
          # Note this is NOT sufficient on its own for this repo. Creating a
          # Pages site needs repository admin, and pages:write on GITHUB_TOKEN
          # does not grant it, so the attempt came back "Create Pages site
          # failed: Resource not accessible by integration". Pages has to be
          # turned on once by an admin under Settings -> Pages, with the source
          # set to GitHub Actions. After that this step only reads the existing
          # site and the flag is a harmless no-op that self-heals if the site
          # is ever removed.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
