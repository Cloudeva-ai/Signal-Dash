# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4 targets Node 20, which the runners now force onto Node 24 and warn
        # about. No inputs are passed here, so the bump carries no risk.
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages was never enabled on this repo, so the first deploy failed
          # with "Get Pages site failed ... verify that the repository has
          # Pages enabled". This lets the workflow create and configure the
          # Pages site itself using the pages:write permission granted above,
          # rather than needing someone to flip it in repository settings.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
